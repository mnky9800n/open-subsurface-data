Name: Open Subsurface Data
Description: |
  Open 3D post-stack seismic volumes gathered from public archives (the USGS National Archive of Marine Seismic
  Surveys and South Australia's SARIG), kept as the sources shipped them, byte for byte. Each survey comes with a
  JSON summary of its header layout and the fixes a reader needs, and index tables tie the Gulf of Mexico
  surveys to the exploration wells drilled inside them and whether those wells found pay. Release 0.1 holds 156
  surveys (909 GB): every SARIG 3D survey, the NAMSS surveys offshore California and in the Beaufort Sea, and 20
  depth-migrated Gulf of Mexico surveys.
Documentation: https://github.com/mnky9800n/open-subsurface-data/blob/main/docs/dataset.md
Contact: john@veleslabs.ai, or open an issue at https://github.com/mnky9800n/open-subsurface-data/issues
ManagedBy: "[Veles Labs](https://veleslabs.ai)"
UpdateFrequency: New surveys and sources are added in numbered releases, a few times a year. Files already in the bucket do not change.
Tags:
  - aws-pds
  - geophysics
  - geoscience
  - seismology
  - exploration
  - energy
  - drilling
  - machine learning
License: |
  Each file keeps its source's terms, listed with credit lines in data/sources.csv of the repository.
  USGS NAMSS: Public domain ("no restrictions on usage or publication"); DataCite lists CC0 1.0 for the DOI.
  SARIG: CC BY 4.0 (CKAN license_id; the disclaimer file inside each zip says CC BY 3.0 AU).
  Index tables and per-survey metadata written by Veles Labs: CC BY 4.0.
Citation: |
  Aiken, J. M. (2026). Open Subsurface Data, release 0.1. Veles Labs. DOI to come.
  Please also cite each source you use. NAMSS: Triezenberg, P.J., Hart, P.E., and Childs, J.R., 2016, National
  Archive of Marine Seismic Surveys (NAMSS), U.S. Geological Survey data release, https://doi.org/10.5066/F7930R7P.
  SARIG: Department for Energy and Mining, Government of South Australia (SARIG).
Resources:
  - Description: |
      Seismic volumes as SEG-Y, with the side files from each source zip (navigation shapefiles, processing
      reports, notes), under data/original/source=<source>/survey=<survey_id>/. Per-survey header metadata (JSON),
      the index tables (CSV, GeoJSON) and a file list with checksums for each release under metadata/.
    ARN: arn:aws:s3:::<BUCKET-NAME>
    Region: <AWS-REGION>
    Type: S3 Bucket
  - Description: Notifications for new objects in the bucket
    ARN: arn:aws:sns:<AWS-REGION>:<ACCOUNT-ID>:<BUCKET-NAME>-object_created
    Region: <AWS-REGION>
    Type: SNS Topic
