[project]
name = "open-subsurface-data"
version = "0.1.0"
description = "An index of open subsurface data (3D seismic and wells) and a tool that fetches it from the original archives."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "John M. Aiken", email = "john@veleslabs.ai" }]
dependencies = []

[project.optional-dependencies]
# Some SARIG zips use Deflate64 (zip method 9), which the standard library cannot read.
deflate64 = ["zipfile-deflate64>=0.2"]

[project.scripts]
osd = "osd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osd"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "osd/data"
